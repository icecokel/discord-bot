name: Deploy to OCI

on:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: discord-bot-oci-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64, discord-bot-oci]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use the OCI runtime
        run: echo "/srv/discord-bot/.local/node/bin" >> "$GITHUB_PATH"

      - run: npm ci
      - run: npm run gen:registry
      - run: npm test -- --runInBand
      - run: npm run type-check
      - run: npm run build
      # Production settings live in repository secrets and variables (Settings > Secrets and
      # variables > Actions). GitHub reserves the GITHUB_ prefix, so GH_X is written as GITHUB_X.
      - name: Render production .env from GitHub secrets and variables
        env:
          BOT_SECRETS_JSON: ${{ toJSON(secrets) }}
          BOT_VARS_JSON: ${{ toJSON(vars) }}
        run: node scripts/render-production-env.cjs "$RUNNER_TEMP/production.env"
      - name: Deploy locally and verify Discord login
        run: |
          if [ -s "$RUNNER_TEMP/production.env" ]; then
            export RENDERED_ENV_FILE="$RUNNER_TEMP/production.env"
          fi
          bash scripts/deploy-oci.sh
      - name: Remove the rendered .env from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/production.env"
