name: Deploy to OCI

on:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: discord-bot-oci-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64, discord-bot-oci]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use the OCI runtime
        run: echo "/srv/discord-bot/.local/node/bin" >> "$GITHUB_PATH"

      - run: npm ci
      - run: npm run gen:registry
      - run: npm test -- --runInBand
      - run: npm run type-check
      - run: npm run build
      # Production settings live in repository secrets and variables (Settings > Secrets and
      # variables > Actions). GitHub reserves the GITHUB_ prefix, so GH_X is written as GITHUB_X.
      # Secrets are listed one by one (least privilege): a new secret needs a line here.
      # Every repository variable is included automatically. Unset secrets are skipped.
      - name: Render production .env from GitHub secrets and variables
        env:
          BOT_SECRETS_JSON: >-
            {
            "ADMIN_ID": ${{ toJSON(secrets.ADMIN_ID) }},
            "ANTHROPIC_API_KEY": ${{ toJSON(secrets.ANTHROPIC_API_KEY) }},
            "DISCORD_BOT_TOKEN": ${{ toJSON(secrets.DISCORD_BOT_TOKEN) }},
            "GH_TOKEN": ${{ toJSON(secrets.GH_TOKEN) }},
            "GMAIL_ADDRESS": ${{ toJSON(secrets.GMAIL_ADDRESS) }},
            "GMAIL_APP_PASSWORD": ${{ toJSON(secrets.GMAIL_APP_PASSWORD) }},
            "NAVER_APP_CLIENT_ID": ${{ toJSON(secrets.NAVER_APP_CLIENT_ID) }},
            "NAVER_APP_CLIENT_SECRET": ${{ toJSON(secrets.NAVER_APP_CLIENT_SECRET) }},
            "PRIVATE_CHANNEL_ID": ${{ toJSON(secrets.PRIVATE_CHANNEL_ID) }},
            "WEATHER_MIDDLE_API_KEY": ${{ toJSON(secrets.WEATHER_MIDDLE_API_KEY) }},
            "WEATHER_SHORT_API_KRY": ${{ toJSON(secrets.WEATHER_SHORT_API_KRY) }}
            }
          BOT_VARS_JSON: ${{ toJSON(vars) }}
        run: node scripts/render-production-env.cjs "$RUNNER_TEMP/production.env"
      - name: Deploy locally and verify Discord login
        run: |
          if [ -s "$RUNNER_TEMP/production.env" ]; then
            export RENDERED_ENV_FILE="$RUNNER_TEMP/production.env"
          fi
          bash scripts/deploy-oci.sh
      - name: Remove the rendered .env from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/production.env"
