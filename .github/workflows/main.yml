name: Deploy to OCI

on:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: discord-bot-oci-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64, discord-bot-oci]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use the OCI runtime
        run: echo "/home/ubuntu/discord-bot/.local/node/bin" >> "$GITHUB_PATH"

      - run: npm ci
      - run: npm run gen:registry
      - run: npm test -- --runInBand
      - run: npm run type-check
      - run: npm run build
      - name: Deploy locally and verify Discord login
        run: bash scripts/deploy-oci.sh
