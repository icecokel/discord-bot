name: Deploy to Mac mini

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: [self-hosted, macOS, ARM64, mac-mini, discord-bot]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate command registry
        run: npm run gen:registry

      - name: Run tests
        run: npm test -- --runInBand

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Deploy and restart launchd process
        run: bash scripts/deploy-mac-mini.sh
